version: '3.8'

services:
  db:
    image: postgres:15
    container_name: pos_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pos_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d pos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pos_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pos_backend
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/pos_db?schema=public
      - JWT_SECRET=super_secret_jwt_key_here
      - PORT=3000
      - FRONTEND_URL=http://localhost:5173
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pos_frontend
    environment:
      - VITE_API_URL=http://localhost:3000/api
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  pgdata:
